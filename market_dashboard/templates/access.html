<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <title>Parity Market Dashboard</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #eeeeee;
        color: #192027;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: #eeeeee; }
      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      section {
        width: min(100%, 430px);
        border: 1px solid #dff2f4;
        border-radius: 16px;
        background: #fdfdfd;
        padding: 32px;
        box-shadow: 0 16px 50px rgba(25, 32, 39, 0.13);
      }
      .eyebrow {
        margin: 0 0 12px;
        color: #06b2bc;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      h1 { margin: 0 0 8px; font-size: 28px; line-height: 1.15; }
      p { margin: 0 0 22px; color: #4a5866; line-height: 1.5; }
      [role="alert"] { color: #b42318; }
      label { display: block; margin-bottom: 7px; font-weight: 700; }
      input[type="password"] {
        width: 100%;
        min-height: 46px;
        border: 1px solid #aab7c2;
        border-radius: 8px;
        padding: 10px 12px;
        background: #fff;
        color: #192027;
        font-size: 16px;
      }
      input[type="password"]:focus {
        outline: 3px solid rgba(6, 178, 188, 0.2);
        border-color: #06b2bc;
      }
      button {
        width: 100%;
        min-height: 46px;
        margin-top: 16px;
        border: 0;
        border-radius: 8px;
        background: #192027;
        color: #fff;
        cursor: pointer;
        font-size: 15px;
        font-weight: 800;
      }
      button:hover { background: #2a3540; }
    </style>
  </head>
  <body>
    <main>
      <section>
        <p class="eyebrow">Parity</p>
        <h1>Market Runway Dashboard</h1>
        {% if configured %}
          <p>Enter the dashboard password to continue.</p>
          {% if error %}<p role="alert">{{ error }}</p>{% endif %}
          <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <input type="hidden" name="next" value="{{ next_url }}">
            <label for="password">Dashboard password</label>
            <input
              id="password"
              name="password"
              type="password"
              required
              autofocus
              autocomplete="current-password"
            >
            <button type="submit">Open dashboard</button>
          </form>
        {% else %}
          <p role="alert">
            {{ error or "Dashboard access is not configured. Contact the Parity administrator." }}
          </p>
        {% endif %}
      </section>
    </main>
  </body>
</html>
