services:
  - type: web
    name: building-analyzer
    runtime: docker
    plan: standard
    dockerfilePath: ./Dockerfile.railway
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    numInstances: 1
    disk:
      name: review-storage
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: STORAGE_DIR
        value: /var/data/storage
      - key: MARKET_DASHBOARD_STORAGE_DIR
        value: /var/data/storage/market_dashboard
      - key: MARKET_DASHBOARD_PUBLISH_SECRET
        sync: false
      - key: JOBS_DB_PATH
        value: /var/data/storage/jobs.db
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: MAPBOX_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: SHEET_INTAKE_GROK_ENABLED
        value: "true"
      - key: SHEET_INTAKE_GROK_SAMPLE_ROWS
        value: "25"
      - key: SHEET_INTAKE_GROK_AUTO_CONFIDENCE
        value: "0.90"
      - key: SHEET_INTAKE_RESOLUTION_CACHE_SECONDS
        value: "86400"
      - key: GEMINI_GROK_EMERGENCY_FALLBACK_ENABLED
        value: "true"
      - key: ANALYZE_API_KEY
        sync: false
      - key: SITE_ACCESS_ENABLED
        value: "true"
      - key: SITE_ACCESS_PASSWORD
        sync: false
      - key: SITE_SESSION_SECRET
        generateValue: true
      - key: SITE_COOKIE_SECURE
        value: "true"
      - key: ALEX_REVIEW_QUEUE_ENABLED
        value: "false"
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: SHEET_PARENT_FOLDER_ID
        sync: false
      - key: SHEET_SHARE_WITH
        sync: false
      - key: ANALYZE_FILE_MAX_ROWS
        value: "250"
      - key: ANALYZE_MAX_BATCH_ROWS
        value: "250"
      - key: ANALYZE_MONTHLY_ADDRESS_LIMIT
        value: "2500"
      - key: MULTI_TAB_WORKBOOK_ENABLED
        value: "true"
      - key: MULTI_TAB_BROWSER_ENABLED
        value: "true"
      - key: MULTI_TAB_DRIVE_ENABLED
        value: "true"
      - key: MULTI_TAB_API_ENABLED
        value: "true"
      - key: WORKBOOK_AUTO_APPROVAL_ROWS
        value: "250"
      - key: WORKBOOK_CHUNK_ROWS
        value: "100"
      - key: MAX_REQUEST_BYTES
        value: "52428800"
      - key: GEOCODER_PROVIDER
        value: google
      - key: IMAGERY_PROVIDER
        value: google
      - key: MODEL_PATHS
        value: models/rooftop_model.pt,models/rooftop_model_prev.pt
      - key: VLM_ADDRESS_CONCURRENCY
        value: "5"
      - key: VLM_TIMEOUT_SECONDS
        value: "120"
      - key: VLM_CONSENSUS_THRESHOLD
        value: "0.7"
      - key: YOLO_CONF
        value: "0.18"
      - key: APP_URL
        value: https://building-analyzer.onrender.com
