services:
  - type: web
    name: building-analyzer
    runtime: docker
    plan: standard
    dockerfilePath: ./Dockerfile.railway
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    numInstances: 1
    envVars:
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: MAPBOX_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: ANALYZE_API_KEY
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: SHEET_SHARE_WITH
        sync: false
      - key: ANALYZE_FILE_MAX_ROWS
        value: "250"
      - key: GEOCODER_PROVIDER
        value: google
      - key: IMAGERY_PROVIDER
        value: google
      - key: MODEL_PATHS
        value: models/rooftop_model.pt,models/rooftop_model_prev.pt
      - key: VLM_ADDRESS_CONCURRENCY
        value: "3"
      - key: VLM_TIMEOUT_SECONDS
        value: "120"
      - key: VLM_CONSENSUS_THRESHOLD
        value: "0.7"
      - key: YOLO_CONF
        value: "0.18"
      - key: APP_URL
        value: https://building-analyzer.onrender.com
